version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errcheck
    - staticcheck

  settings:
    depguard:
      rules:
        # Tenet 1: dependencies point inward. The core owns its interfaces and
        # must not know which adapter satisfies them.
        core:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: "database/sql"
              desc: "core owns ports; SQL belongs in internal/adapters/outbound"
            - pkg: "github.com/jackc/pgx"
              desc: "core owns ports; the Postgres driver belongs in an adapter"
            - pkg: "github.com/rabbitmq"
              desc: "core owns ports; the broker client belongs in an adapter"
            - pkg: "net/http"
              desc: "core owns ports; transport belongs in internal/adapters/inbound"

    errcheck:
      # An unchecked type assertion is the discovery move the settled decision
      # forbids: capability is reached through an accessor, never through
      # fs.(Symlinker).
      check-type-assertions: true

    staticcheck:
      # The default set minus its own -ST1000: every package here carries a
      # package comment, and this keeps that true.
      checks:
        - all
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"

  exclusions:
    rules:
      - path: _test\.go$
        linters: [errcheck]

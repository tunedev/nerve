version: "2"

linters:
  default: standard
  enable:
    # Tenet 4: never store a Context in a struct. containedctx takes no options.
    - containedctx
    - depguard
    - errcheck
    - revive
    - staticcheck

  settings:
    depguard:
      rules:
        # Tenet 1: dependencies point inward. The core owns its interfaces and
        # must not know which adapter satisfies them.
        core:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: "database/sql"
              desc: "core owns ports; SQL belongs in internal/adapters/outbound"
            - pkg: "github.com/jackc/pgx"
              desc: "core owns ports; the Postgres driver belongs in an adapter"
            - pkg: "github.com/rabbitmq"
              desc: "core owns ports; the broker client belongs in an adapter"
            - pkg: "net/http"
              desc: "core owns ports; transport belongs in internal/adapters/inbound"
            - pkg: "os/exec"
              desc: "core owns ports; running an engine belongs in internal/adapters/outbound"

    errcheck:
      # An unchecked type assertion is the discovery move the settled decision
      # forbids: capability is reached through an accessor, never through
      # fs.(Symlinker).
      check-type-assertions: true

    revive:
      # Only the rules named here run. Formatting opinions stay with gofmt.
      rules:
        # Tenet 4: ctx is the first parameter of every blocking or remote
        # function. *testing.T may precede it so helpers keep the stdlib shape.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,*testing.B,*testing.F"

    staticcheck:
      # The default set minus its own -ST1000: every package here carries a
      # package comment, and this keeps that true.
      checks:
        - all
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"

  exclusions:
    rules:
      - path: _test\.go$
        linters: [errcheck]

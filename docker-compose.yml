# The full local stack. No cloud account, no paid tier, works offline.
# Versions are pinned deliberately; bump them on purpose, not by drift.
# Published ports come from .env so a port already taken on the host is one
# edit to an ignored file, not an edit to this one.
# State lives in named volumes rather than bind mounts, so `docker compose down -v`
# removes it. A bind mount leaves behind files owned by the container's user.
name: nerve

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nerve
      POSTGRES_PASSWORD: nerve
      POSTGRES_DB: nerve
    ports: ["${NERVE_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerve -d nerve"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: nerve
      RABBITMQ_DEFAULT_PASS: nerve
    ports:
      - "${NERVE_RABBITMQ_PORT:-5672}:5672"
      - "${NERVE_RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["${NERVE_OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  ollama-data:

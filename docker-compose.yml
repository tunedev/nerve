# The full local stack. No cloud account, no paid tier, works offline.
# Versions are pinned deliberately; bump them on purpose, not by drift.
name: nerve

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nerve
      POSTGRES_PASSWORD: nerve
      POSTGRES_DB: nerve
    ports: ["5432:5432"]
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerve -d nerve"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: nerve
      RABBITMQ_DEFAULT_PASS: nerve
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ./.data/ollama:/root/.ollama

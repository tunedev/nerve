# The full local stack. No cloud account, no paid tier, works offline.
# Versions are pinned deliberately; bump them on purpose, not by drift.
# Published ports come from .env so a port already taken on the host is one
# edit to an ignored file, not an edit to this one.
# State lives in named volumes rather than bind mounts, so `docker compose down -v`
# removes it. A bind mount leaves behind files owned by the container's user.
name: nerve

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nerve
      POSTGRES_PASSWORD: nerve
      POSTGRES_DB: nerve
    ports: ["${NERVE_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nerve -d nerve"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: nerve
      RABBITMQ_DEFAULT_PASS: nerve
    ports:
      - "${NERVE_RABBITMQ_PORT:-5672}:5672"
      - "${NERVE_RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nerve
      MINIO_ROOT_PASSWORD: nervenerve
    ports:
      - "${NERVE_MINIO_PORT:-9000}:9000"
      - "${NERVE_MINIO_UI_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The bucket a mount points at has to exist before the mount does, and an
  # object store has no "create it if it is missing" the way a directory does.
  # This runs to completion and stops; `up --wait` waits for that.
  minio-bucket:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set nerve http://minio:9000 nerve nervenerve &&
             mc mb --ignore-existing nerve/nerve"
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports: ["${NERVE_OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  minio-data:
  ollama-data:

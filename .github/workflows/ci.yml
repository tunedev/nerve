name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: make fmt-check

      - name: Build
        run: go build ./...

      - name: Reproducible build
        run: make repro

      - name: Test (race detector)
        run: make race

      # The linter is a go.mod tool dependency, so CI and `make lint` run the same
      # pinned version. One pin, in one place.
      - name: Lint
        run: make lint

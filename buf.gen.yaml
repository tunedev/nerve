# The generators are go.mod tool dependencies, so the code they write is pinned
# by the repo rather than by whatever is on PATH.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/tunedev/nerve/internal/gen
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt:
      - paths=source_relative
      - simple
